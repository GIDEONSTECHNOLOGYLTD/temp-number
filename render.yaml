services:
  - type: web
    name: tempsms-pro
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/tempsms.db
    disk:
      name: tempsms-data
      mountPath: /tmp
      sizeGB: 1
